function music(kind='win') {if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime;const notes=kind==='win'?[523,659,784]:kind==='end'?[523,659,784,1047]:[300,260];notes.forEach((freq,i)=>{let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=kind==='no'?'sine':'triangle';osc.frequency.setValueAtTime(freq,now+i*.105);gain.gain.setValueAtTime(.0001,now+i*.105);gain.gain.exponentialRampToValueAtTime(.085,now+i*.105+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.105+.18);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+i*.105);osc.stop(now+i*.105+.19);});}catch(e){}}
$('#soundToggle').addEventListener('click',()=>{sound=!sound;store.set('aventura_sonido',sound);updateSound();if(sound)music('win')});
function updateSound(){$('#soundToggle').textContent=sound?'🔊 Sonido':'🔇 Silencio'}updateSound();
function heroName(){let n=$('#nameInput');if(n){player=n.value.trim().slice(0,25);store.set('aventura_nombre',player)}return player||'campeona'}
function renderHome(){run=null;document.title='🌈 Aventura Matemática | Primer grado';$('#app').innerHTML=`<section class="homeHero"><div class="heroGrid"><div><span class="tag">✨ ¡Aprender puede ser una aventura!</span><h1>¡Jugamos con las <span>matemáticas!</span></h1><p>Cuenta, suma, resta, compara y gana estrellas. ¡Cada respuesta es una nueva aventura!</p><div class="nameWrap"><label for="nameInput"><span>💜 ¿Cómo te llamas?</span><input id="nameInput" maxlength="25" placeholder="Escribe tu nombre" value="${escapeHTML(player)}" autocomplete="given-name"></label></div><button class="startButton" id="allTopics">🚀 ¡Empezar gran aventura!</button><div class="statsStrip"><span>⭐ ${totalSaved} estrellas ganadas</span><span>🎯 8 mundos para explorar</span><span>🎉 Sin límite de intentos</span></div></div><div class="mascot-wrap"><span class="little-star a">✨</span><span class="little-star b">🌟</span>${mascotsvg}</div></div></section><div class="section-header"><div><h2>🎨 Elige un mundo para jugar</h2><p>Puedes practicar un tema o jugar la gran aventura.</p></div></div><div class="topicGrid">${categories.map(cat=>`<button class="topicCard" data-topic="${cat.id}" style="--stripe:${cat.color};--wash:${cat.wash}" aria-label="Jugar ${cat.label}"><span class="topicIcon">${cat.icon}</span><strong>${cat.label}</strong><small>${cat.desc}</small><span class="go">➜</span></button>`).join('')}</div><p class="helpText">🏡 Funciona sin internet. Cada partida tiene preguntas nuevas y puedes volver a jugar cuantas veces quieras.</p>`;$('#allTopics').addEventListener('click',()=>startGame('todos'));document.querySelectorAll('[data-topic]').forEach(el=>el.addEventListener('click',()=>startGame(el.dataset.topic)));$('#nameInput').addEventListener('change',heroName)}
const emojiGroup=(count,emoji)=>`<div class="mathObjects" aria-label="${count} dibujos">${Array.from({length:count},()=>`<span class="smallObj">${emoji}</span>`).join('')}</div>`;
const countScene=(n,emoji)=>`<div class="objectGrid" aria-label="Cuenta los ${n} objetos">${Array.from({length:n},()=>`<span class="objectTile">${emoji}</span>`).join('')}</div>`;
const mathScene=(a,b,op,icon)=>`<div class="visualRow">${emojiGroup(a,icon)}<span class="mathSign">${op}</span>${emojiGroup(b,icon)}</div>`;
const seqScene=(n)=>`<div class="seqRow">${[n-2,n-1,null,n+1,n+2].map(v=>`<span class="seqNum ${v===null?'missing':''}">${v===null?'?':v}</span>`).join('')}</div>`;
const rodScene=(d,u)=>`<div class="sceneHeading">¿Cuántos hay en total?</div><div class="rodWrap"><div class="rodWrap">${Array.from({length:d},()=>`<div class="tenRod" aria-label="una decena">${'<i></i>'.repeat(10)}</div>`).join('')}</div><div class="cubeWrap">${'<span class="unitCube"></span>'.repeat(u)}</div></div><div class="sceneNote">Cada barra tiene 10 cubitos.</div>`;
const lengthScene=()=>`<div class="sceneHeading">Observa la longitud de los lápices</div><div class="pencilRow"><div class="pencilChoice"><div class="pencil" style="--pencil:#71bfff;width:200px"></div><strong>Azul</strong></div><div class="pencilChoice"><div class="pencil" style="--pencil:#ffe16a;width:132px"></div><strong>Amarillo</strong></div><div class="pencilChoice"><div class="pencil" style="--pencil:#ff9cbc;width:93px"></div><strong>Rosado</strong></div></div>`;
const cupScene=()=>`<div class="sceneHeading">Observa la cantidad de agua</div><div class="cupRow"><div class="pencilChoice"><div class="cup" style="--level:72%"><span class="water"></span></div><span class="measureTag">Vaso A</span></div><div class="pencilChoice"><div class="cup" style="--level:27%"><span class="water"></span></div><span class="measureTag">Vaso B</span></div></div>`;
function chartScene(labels,values,icons){const colors=['#55b9f8','#ffbc4e','#fa8ab5'];return `<div class="sceneHeading">${icons.join('  ')}  ¡Leamos el gráfico!</div><div class="barChartWrap"><div class="barChart" role="img" aria-label="Gráfico de barras de ${labels.map((l,i)=>l+': '+values[i]).join(', ')}">${labels.map((l,i)=>`<div class="barColumn"><span class="barValue">${values[i]}</span><div class="barFill" style="--value:${values[i]};--bar:${colors[i]}"></div><span class="barName">${icons[i]} ${l}</span></div>`).join('')}</div></div>`}
const choose=(prompt,answer,options,scene='',hint='Observa con atención y vuelve a intentarlo.')=>({kind:'choice',prompt,answer:String(answer),options:mix(options.map(String)),scene,hint});
const numeric=(prompt,answer,scene='',hint='Cuenta despacito. ¡Tú puedes!')=>({kind:'number',prompt,answer:Number(answer),scene,hint});
const drawing=(prompt,n,emoji)=>({kind:'draw',prompt,answer:n,emoji,scene:`<div class="sceneNote">Toca el botón «Agregar» para poner dibujos aquí abajo.</div>`,hint:`Necesitas colocar ${n} dibujos. Cuéntalos uno por uno.`});
const ordering=(values,asc=true)=>({kind:'order',prompt:`Ordena los números de ${asc?'menor a mayor':'mayor a menor'}.`,numbers:values,answer:[...values].sort((a,b)=>asc?a-b:b-a).join(','),scene:`<div class="sceneNote">Toca los números en el orden correcto.</div>`,hint:asc?'Empieza por el número más pequeño.':'Empieza por el número más grande.'});
const unique=(a,b,c)=>new Set([a,b,c]).size===3;
function numberQuestions(){let qs=[];for(const [n,icon] of [[7,'🍎'],[9,'⭐'],[12,'🦋'],[6,'🐥']])qs.push(choose('¿Cuántos dibujos hay?',n,[n,n+1,n-1],countScene(n,icon),'Señala cada dibujo y cuenta 1, 2, 3…'));qs.push(numeric('¿Qué número falta en la secuencia?',12,seqScene(12),'Mira qué número está entre 11 y 13.'));qs.push(numeric('¿Qué número falta en la secuencia?',18,seqScene(18),'Los números van avanzando de uno en uno.'));qs.push(choose('¿Cómo se escribe el número catorce?',14,[12,14,17],'<div class="numberBig">catorce</div>'));qs.push(choose('¿Qué número es «diecisiete»?',17,[16,17,19],'<div class="numberBig" style="font-size:2.5rem">diecisiete</div>'));qs.push(ordering([9,14,6],true),ordering([10,17,13],false));qs.push(drawing('Dibuja 5 estrellas.',5,'⭐'));qs.push(numeric('¿Cuál es el número anterior a 20?',19,'<div class="numberBig">❔ 20</div>'));return qs}
function operationQuestions(){let qs=[];for(const [a,b,op,icon] of [[4,3,'+','🍎'],[5,4,'+','🍪'],[7,2,'−','🦋'],[9,3,'−','⭐']]){const ans=op==='+'?a+b:a-b;qs.push(numeric(`¿Cuánto es ${a} ${op} ${b}?`,ans,op==='+'?mathScene(a,b,'+',icon):`<div class="sceneHeading">${a} ${icon} en total</div>${emojiGroup(a,icon)}<div class="sceneNote">Si quitamos ${b}, ¿cuántos quedan?</div>`,op==='+'?'Cuando sumamos, juntamos las cantidades.':'Cuando restamos, quitamos una parte.'))}qs.push(choose('¿Cuánto es 5 + 3?',8,[7,8,9],'<div class="numberBig">5 + 3 = ?</div>'));qs.push(choose('¿Cuánto es 9 − 4?',5,[4,5,6],'<div class="numberBig">9 − 4 = ?</div>'));qs.push(numeric('Había 6 naranjas y llegaron 4 más. ¿Cuántas hay ahora?',10,emojiGroup(6,'🍊')+'<div class="mathSign">+</div>'+emojiGroup(4,'🍊'),'Junta las 6 naranjas con las 4 nuevas.'));qs.push(numeric('Había 10 globos y se reventaron 4. ¿Cuántos quedan?',6,emojiGroup(10,'🎈'),'Si tenías 10 y se fueron 4, cuenta las que quedan.'));qs.push(numeric('¿Cuánto es 8 + 7?',15,'<div class="numberBig">8 + 7 = ?</div>'));qs.push(numeric('¿Cuánto es 14 − 6?',8,'<div class="numberBig">14 − 6 = ?</div>'));return qs}
function tenQuestions(){let qs=[];for(const [d,u] of [[2,5],[3,6],[1,4],[4,3]])qs.push(numeric('Mira las barras y los cubitos. ¿Qué número forman?',d*10+u,rodScene(d,u),'Cada barra vale 10 y cada cubito vale 1.'));qs.push(choose('¿Cuántas decenas tiene 34?',3,[3,4,1],'<div class="numberBig">34</div>','La primera cifra nos dice cuántas decenas hay.'));qs.push(choose('¿Cuántas unidades tiene 46?',6,[4,6,0],'<div class="numberBig">46</div>','La última cifra dice las unidades.'));qs.push(numeric('2 decenas y 7 unidades forman el número…',27,`<div class="visualRow"><div class="numberBox">2 D</div><span class="mathSign">+</span><div class="numberBox">7 U</div></div>`));qs.push(numeric('4 decenas y 0 unidades forman el número…',40,`<div class="visualRow"><div class="numberBox">4 D</div><span class="mathSign">+</span><div class="numberBox">0 U</div></div>`));qs.push(numeric('¿Cuántas decenas hay en 50?',5,'<div class="numberBig">50</div>'));qs.push(numeric('¿Cuántas unidades hay en 29?',9,'<div class="numberBig">29</div>'));return qs}
function doubleQuestions(){let qs=[];for(const [n,icon] of [[3,'🍎'],[4,'⚽'],[5,'🌸']])qs.push(numeric(`¿Cuál es el doble de ${n}?`,2*n,emojiGroup(n,icon),'Para hallar el doble, suma la misma cantidad dos veces.'));for(const [n,icon] of [[6,'🍪'],[8,'⭐'],[10,'🍬']])qs.push(numeric(`¿Cuál es la mitad de ${n}?`,n/2,emojiGroup(n,icon),'La mitad es repartir en dos grupos iguales.'));qs.push(choose('¿Cuál es el doble de 4?',8,[6,8,10],'<div class="numberBig">4 + 4 = ?</div>'));qs.push(choose('¿Cuál es la mitad de 10?',5,[4,5,6],emojiGroup(10,'🟢')));qs.push(drawing('Dibuja el doble de 3 estrellas.',6,'⭐'));qs.push(drawing('Dibuja la mitad de 8 flores.',4,'🌸'));return qs}
function compareQuestions(){let qs=[];for(const [a,b] of [[18,12],[7,10],[15,15],[6,13],[20,17]]){qs.push(choose(`¿Qué signo corresponde entre ${a} y ${b}?`,a>b?'>':a<b?'<':'=', ['>','<','='],`<div class="visualRow"><span class="numberBox">${a}</span><span class="mathSign">?</span><span class="numberBox">${b}</span></div>`, 'El cocodrilo abre la boca hacia el número más grande.'))}qs.push(choose('¿Cuál es el número mayor?',18,[13,18,15],'<div class="visualRow"><span class="numberBox">13</span><span class="numberBox">18</span><span class="numberBox">15</span></div>'));qs.push(choose('¿Cuál es el número menor?',8,[8,15,12],'<div class="visualRow"><span class="numberBox">8</span><span class="numberBox">15</span><span class="numberBox">12</span></div>'));qs.push(ordering([3,8,6],true),ordering([9,2,5],false));return qs}
function measureQuestions(){return [choose('¿Cuál es el lápiz más largo?','Azul',['Azul','Amarillo','Rosado'],lengthScene(),'El más largo llega más lejos.'),choose('¿Cuál es el lápiz más corto?','Rosado',['Azul','Amarillo','Rosado'],lengthScene(),'Busca el que termina primero.'),choose('¿Qué vaso tiene más agua?','Vaso A',['Vaso A','Vaso B','Iguales'],cupScene(),'Observa cuál vaso tiene un nivel más alto.'),choose('¿Qué vaso tiene menos agua?','Vaso B',['Vaso A','Vaso B','Iguales'],cupScene()),choose('¿Cuál objeto pesa más?','Sandía',['Sandía','Manzana','Iguales'],'<div class="iconCompare"><span>🍉</span><span class="versus">o</span><span>🍎</span></div>'),choose('¿Cuál objeto pesa menos?','Pluma',['Pelota','Pluma','Iguales'],'<div class="iconCompare"><span>⚽</span><span class="versus">o</span><span>🪶</span></div>'),choose('¿Qué unidad usamos para medir el largo de un lápiz?','Centímetro',['Centímetro','Kilogramo','Litro'],'<div class="iconCompare"><span>✏️</span><span>📏</span></div>'),choose('¿Qué unidad usamos para medir el peso de una sandía?','Kilogramo',['Metro','Litro','Kilogramo'],'<div class="iconCompare"><span>🍉</span><span>⚖️</span></div>'),choose('¿Con qué medimos la cantidad de agua de una botella?','Litro',['Litro','Metro','Kilogramo'],'<div class="iconCompare"><span>💧</span><span>🧴</span></div>'),choose('¿Qué recipiente puede guardar más agua?','Balde',['Taza','Balde','Cuchara'],'<div class="iconCompare"><span>☕</span><span class="versus">o</span><span>🪣</span></div>')]}
function dataQuestions(){const s1=chartScene(['Pelotas','Carros','Muñecas'],[3,5,2],['⚽','🚗','🪆']);const s2=chartScene(['Manzanas','Plátanos','Fresas'],[4,3,5],['🍎','🍌','🍓']);const s3=chartScene(['Perros','Gatos','Conejos'],[5,3,2],['🐶','🐱','🐰']);return [choose('¿Qué juguete hay en mayor cantidad?','Carros',['Pelotas','Carros','Muñecas'],s1,'La barra más alta muestra la cantidad mayor.'),choose('¿Qué juguete hay en menor cantidad?','Muñecas',['Pelotas','Carros','Muñecas'],s1),numeric('¿Cuántas pelotas hay en el gráfico?',3,s1),numeric('¿Cuántos carros hay en el gráfico?',5,s1),choose('¿Cuál fruta es la favorita de más niños?','Fresas',['Manzanas','Plátanos','Fresas'],s2),numeric('¿Cuántos niños prefieren los plátanos?',3,s2),numeric('¿Cuántos niños prefieren las manzanas?',4,s2),choose('¿Qué mascota aparece más veces?','Perros',['Perros','Gatos','Conejos'],s3),choose('¿Qué mascota aparece menos veces?','Conejos',['Perros','Gatos','Conejos'],s3),numeric('¿Cuántas mascotas aparecen en total?',10,s3,'Suma los valores de las tres barras.') ]}
function shapeQuestions(){return [choose('¿Qué figura tiene tres lados?','Triángulo',['Círculo','Cuadrado','Triángulo'],'<div class="shapeRow"><span class="shape circle"></span><span class="shape square"></span><span class="shape triangle"></span></div>'),choose('¿Qué figura no tiene lados rectos?','Círculo',['Círculo','Cuadrado','Triángulo'],'<div class="shapeRow"><span class="shape circle"></span><span class="shape square"></span><span class="shape triangle"></span></div>'),choose('¿Qué figura tiene cuatro lados iguales?','Cuadrado',['Triángulo','Cuadrado','Círculo'],'<div class="shapeRow"><span class="shape square"></span><span class="shape triangle"></span></div>'),choose('¿Qué objeto se parece a una esfera?','Pelota',['Pelota','Libro','Puerta'],'<div class="iconCompare"><span>⚽</span><span>📚</span><span>🚪</span></div>'),choose('¿Qué objeto se parece a un cilindro?','Lata',['Pelota','Lata','Caja'],'<div class="iconCompare"><span>⚽</span><span>🥫</span><span>📦</span></div>'),choose('¿Qué forma tiene una rueda?','Círculo',['Triángulo','Círculo','Cuadrado'],'<div class="iconCompare"><span>🛞</span></div>'),numeric('¿Cuántos lados tiene un triángulo?',3,'<div class="shapeRow"><span class="shape triangle"></span></div>'),numeric('¿Cuántos lados tiene un cuadrado?',4,'<div class="shapeRow"><span class="shape square"></span></div>'),choose('¿Qué forma tiene una señal de alto común?','Octágono',['Círculo','Octágono','Triángulo'],'<div class="numberBig" style="font-size:6rem">🛑</div>'),drawing('Dibuja 4 círculos.',4,'🔵')]}
const factories={numeros:numberQuestions,operaciones:operationQuestions,decenas:tenQuestions,doble:doubleQuestions,comparar:compareQuestions,medidas:measureQuestions,datos:dataQuestions,formas:shapeQuestions};
function startGame(topic){heroName();let topicName=topic==='todos'?'La gran aventura':categories.find(c=>c.id===topic).label;let questions;if(topic==='todos'){questions=categories.flatMap(c=>mix(factories[c.id]()).slice(0,1));let extra=mix(categories).slice(0,4).flatMap(c=>mix(factories[c.id]()).slice(1,2));questions=mix([...questions,...extra]);}else questions=mix(factories[topic]()).slice(0,8);run={topic,topicName,questions,index:0,correct:0,stars:0,tries:0,done:false,wrong:'',entry:'',chosen:[],drawn:0,skipped:0};renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}
function current(){return run.questions[run.index]}
function renderQuestion(){if(!run)return;const q=current(),idx=run.index+1,total=run.questions.length;document.title=`Pregunta ${idx} · Aventura Matemática`;
let widgets='';if(q.kind==='choice'){widgets=`<div class="options">${q.options.map((op,i)=>`<button class="optionBtn ${run.wrong===op&&!run.done?'wrong':''} ${run.done&&op===q.answer?'right':''}" data-answer="${escapeHTML(op)}" ${run.done?'disabled':''}><span class="optionLetter">${String.fromCharCode(65+i)}</span>${escapeHTML(op)}</button>`).join('')}</div>`}
if(q.kind==='number'){widgets=`<div class="answerArea"><label class="answerTitle" for="answerInput">✍️ Escribe tu respuesta:</label><input type="text" id="answerInput" class="answerInput" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="3" aria-label="Tu respuesta" value="${escapeHTML(run.entry)}" ${run.done?'disabled':''}><div class="keyPad">${['1','2','3','4','5','6','7','8','9','⌫','0','Borrar'].map(v=>`<button type="button" data-key="${v}" ${run.done?'disabled':''}>${v}</button>`).join('')}</div>${!run.done?`<div class="actionRow"><button class="primary" id="checkNum">✅ Comprobar</button></div>`:''}</div>`}
if(q.kind==='order'){widgets=`<div class="answerArea"><p class="answerTitle" style="text-align:center">Coloca los números en orden:</p><div class="orderSlots">${[0,1,2].map(i=>`<div class="orderSlot">${run.chosen[i]===undefined?'?':`<button data-undo="${i}" aria-label="Quitar ${run.chosen[i]}">${run.chosen[i]}</button>`}</div>`).join('')}</div><div class="orderChoiceRow">${q.numbers.map((n,i)=>`<button class="orderChip" data-order="${i}" ${run.done||run.chosen.includes(n)?'disabled':''}>${n}</button>`).join('')}</div><div class="actionRow">${!run.done?`<button class="primary" id="checkOrder" ${run.chosen.length<3?'disabled':''}>✅ Revisar orden</button><button class="secondary" id="clearOrder">↺ Borrar</button>`:''}</div></div>`}
if(q.kind==='draw'){widgets=`<div class="answerArea"><div class="drawPad" aria-label="Has colocado ${run.drawn} dibujos">${Array.from({length:run.drawn},()=>`<span class="drawn">${q.emoji}</span>`).join('')||'<span class="sceneNote">Aquí aparecerán tus dibujos ✨</span>'}</div><div class="drawHelp">Llevas <strong>${run.drawn}</strong> dibujo${run.drawn===1?'':'s'}</div><div class="drawControls">${run.done?'':`<button class="drawAdd" id="addDraw">➕ Agregar ${q.emoji}</button><button class="drawErase" id="eraseDraw">↺ Quitar uno</button>`}</div>${!run.done?`<div class="actionRow"><button class="primary" id="checkDraw">✅ Comprobar</button></div>`:''}</div>`}
const retry=run.wrong!==''&&!run.done;let feedback=run.done?`<div class="feedback good" role="status"><span class="face">🎉</span><span>¡Muy bien, ${escapeHTML(player||'campeona')}! ${run.tries===0?'¡Lo lograste a la primera! ⭐⭐⭐':'¡Lo conseguiste! Cada intento te ayuda a aprender. 🌟'}</span></div><div class="actionRow"><button class="primary" id="nextQ">${idx===total?'🏆 ¡Ver mi premio!':'➡️ Siguiente pregunta'}</button></div>`:retry?`<div class="feedback try" role="status"><span class="face">💛</span><span>¡Casi lo tienes! ${escapeHTML(q.hint||'Vuelve a mirar y prueba otra vez.')}</span></div>`:'';
$('#app').innerHTML=`<div class="gameHeader"><div class="ghTop"><button class="round-btn" id="goHome">🏠 Inicio</button><div class="meta"><span class="chip">${escapeHTML(run.topicName)}</span><span class="chip starChip">⭐ ${run.stars}</span><span class="chip">${idx} de ${total}</span></div></div><div class="progressTrack"><div class="progressBar" style="width:${(run.index+(run.done?1:0))/total*100}%"></div></div></div><article class="questionCard"><div class="qhead"><span class="qType">${q.kind==='choice'?'🔎 Selección única':q.kind==='draw'?'🎨 Desarrollo':q.kind==='order'?'🔢 Ordena':'✏️ Desarrollo'}</span><h1 class="qTitle">${escapeHTML(q.prompt)}</h1><p class="qSubtitle">${q.kind==='choice'?'Toca una respuesta.':q.kind==='number'?'Escribe el número y toca «Comprobar».':q.kind==='order'?'Toca un número para colocarlo en la casilla.':'Coloca la cantidad correcta de dibujos.'}</p></div><div class="questionBody"><div class="scene">${q.scene||''}</div>${widgets}${feedback}${!run.done?`<div class="actionRow"><button class="secondary" id="skipQ">↪ Pasar por ahora</button></div>`:''}</div></article><div class="footerNav">💜 ¡Sigue explorando! Lo importante es aprender, no la velocidad.</div>`;
$('#goHome').addEventListener('click',renderHome);$('#skipQ')?.addEventListener('click',skipQuestion);$('#nextQ')?.addEventListener('click',nextQuestion);
document.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('click',()=>submit(el.dataset.answer)));
if(q.kind==='number'){$('#answerInput').addEventListener('input',e=>{run.entry=e.target.value.replace(/\D/g,'').slice(0,3);if(e.target.value!==run.entry)e.target.value=run.entry});$('#answerInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit(run.entry)}});document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('click',()=>{let v=el.dataset.key;if(v==='Borrar')run.entry='';else if(v==='⌫')run.entry=run.entry.slice(0,-1);else run.entry=(run.entry+v).slice(0,3);$('#answerInput').value=run.entry}));$('#checkNum')?.addEventListener('click',()=>submit(run.entry))}
if(q.kind==='order'){document.querySelectorAll('[data-order]').forEach(el=>el.addEventListener('click',()=>{if(run.chosen.length<3)run.chosen.push(q.numbers[Number(el.dataset.order)]);renderQuestion()}));document.querySelectorAll('[data-undo]').forEach(el=>el.addEventListener('click',()=>{run.chosen.splice(Number(el.dataset.undo),1);renderQuestion()}));$('#checkOrder')?.addEventListener('click',()=>submit(run.chosen.join(',')));$('#clearOrder')?.addEventListener('click',()=>{run.chosen=[];run.wrong='';renderQuestion()})}
if(q.kind==='draw'){$('#addDraw')?.addEventListener('click',()=>{run.drawn=Math.min(40,run.drawn+1);renderQuestion()});$('#eraseDraw')?.addEventListener('click',()=>{run.drawn=Math.max(0,run.drawn-1);renderQuestion()});$('#checkDraw')?.addEventListener('click',()=>submit(run.drawn))}
}
function submit(raw){if(!run||run.done)return;const q=current();if(raw===''||raw===null||raw===undefined)return;const good=q.kind==='number'||q.kind==='draw'?Number(raw)===Number(q.answer):String(raw)===String(q.answer);if(good){run.done=true;run.correct++;let earned=run.tries===0?3:run.tries===1?2:1;run.stars+=earned;totalSaved+=earned;store.set('aventura_estrellas',totalSaved);music('win');run.wrong='';}else{run.tries++;run.wrong=String(raw);music('no');if(q.kind==='order')run.chosen=[];}renderQuestion();if(good)window.scrollTo({top:0,behavior:'smooth'})}
function skipQuestion(){if(!run)return;run.skipped++;nextQuestion()}
function nextQuestion(){if(!run)return;if(run.index===run.questions.length-1){renderFinish();return}run.index++;run.tries=0;run.done=false;run.wrong='';run.entry='';run.chosen=[];run.drawn=0;renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}
function renderFinish(){music('end');let name=escapeHTML(player||'campeona');let n=run.questions.length;$('#app').innerHTML=`<section class="finish"><div class="medal">🏆</div><h2>¡Felicidades, ${name}!</h2><p>¡Terminaste <strong>${escapeHTML(run.topicName)}</strong>! Has practicado con muchísima dedicación. 💖</p><div class="score">⭐ Ganaste ${run.stars} estrellas</div><div class="certificate">🎓 Diploma de exploradora matemática<br><span style="display:block;font-size:1.55rem;margin:9px 0;color:#6947c5">${name}</span>Completaste ${n} preguntas · ${run.correct} correctas · ${run.skipped} pasadas</div><p>🌈 ¡Cada vez que juegas, aprendes cosas nuevas!</p><div class="buttons"><button class="primary" id="repeatGame">🔄 Volver a jugar</button><button class="secondary" id="goHomeEnd">🏠 Elegir otro mundo</button><button class="secondary" id="printDiploma">🖨️ Imprimir diploma</button></div></section>`;$('#repeatGame').addEventListener('click',()=>startGame(run.topic));$('#goHomeEnd').addEventListener('click',renderHome);$('#printDiploma').addEventListener('click',()=>window.print());window.scrollTo({top:0,behavior:'smooth'})}
renderHome();
</script>
</body>
</html>
